<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gems Taiwan — Get Involved</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link 
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap" 
    rel="stylesheet" 
  />

  <link rel="stylesheet" href="styles.css" />

  <style>
    .poster-slideshow {
      max-width: 560px;
      margin: 40px auto 50px;
      text-align: center;
      padding: 0 24px;
    }

    .poster-slide-box {
      background: #ffffff;
      padding: 14px;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12);
    }

    .poster-slide-box img {
      width: 100%;
      height: auto;
      display: none;
      border-radius: 12px;
    }

    .poster-slide-box img.active {
      display: block;
    }

    .slideshow-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .slide-btn {
      border: none;
      background: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
      font-family: "DM Sans", sans-serif;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.10);
    }

    .slide-btn:hover {
      transform: translateY(-1px);
    }

    .slide-count {
      font-size: 14px;
      color: var(--text-muted);
    }

    .signup-section {
      text-align: center;
      margin: 60px auto 40px;
      max-width: 900px;
      padding: 0 24px;
    }

    .signup-section a {
      word-break: break-word;
    }

    .standalone-diagram-wrapper {
      margin-top: 50px;
      margin-bottom: 50px;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .standalone-diagram-wrapper img {
      width: 100%;
      max-width: 1300px;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    @media (max-width: 800px) {
      .poster-slideshow {
        max-width: 95%;
        padding: 0 12px;
      }
    }
  </style>

  <script>window.ACTIVE_PAGE = 'involved.html';</script>
  <script defer src="nav.js"></script>
</head>

<body>

<main>

  <h1 class="page-title center" style="margin-top: 32px;">Get Involved</h1>

  <!-- Poster slideshow -->
  <div class="poster-slideshow">
    <div class="poster-slide-box">

      <img 
        class="poster-slide active"
        src="https://raw.githubusercontent.com/Oscariooooo/GEMSTAIWAN_ImageUPLOAD/main/EnglishPoster2.png" 
        alt="English Poster 2">

      <img 
        class="poster-slide"
        src="https://raw.githubusercontent.com/Oscariooooo/GEMSTAIWAN_ImageUPLOAD/main/EnglishPoster4.png" 
        alt="English Poster 4">

      <img 
        class="poster-slide"
        src="https://raw.githubusercontent.com/Oscariooooo/GEMSTAIWAN_ImageUPLOAD/main/EnglishPoster.png" 
        alt="English Poster">

      <img 
        class="poster-slide"
        src="https://raw.githubusercontent.com/Oscariooooo/GEMSTAIWAN_ImageUPLOAD/main/Englishposter3.png" 
        alt="English Poster 3">

    </div>

    <div class="slideshow-controls">
      <button class="slide-btn" type="button" onclick="changeSlide(-1)">← Previous</button>
      <span class="slide-count" id="slideCount">1 / 4</span>
      <button class="slide-btn" type="button" onclick="changeSlide(1)">Next →</button>
    </div>
  </div>

  <!-- Sign-up section -->
  <div class="signup-section">
    <h2>Sign-up Now</h2>
    <p><strong>Fill out this form to get started:</strong></p>

    <a 
      href="https://docs.google.com/forms/d/1GA3MGRhnRAbWJxb010RgmITatjY5hBockVmNfAcopHI/edit" 
      target="_blank">
      https://docs.google.com/forms/d/1GA3MGRhnRAbWJxb010RgmITatjY5hBockVmNfAcopHI/edit
    </a>
  </div> 

  <!-- English flowchart -->
  <div class="standalone-diagram-wrapper">
    <img 
      src="https://raw.githubusercontent.com/Oscariooooo/GEMSTAIWAN_ImageUPLOAD/main/EnglishFlowchart.png" 
      alt="English workshop process diagram">
  </div>

</main>

<script>
  let currentSlide = 0;

  const slides = document.querySelectorAll(".poster-slide");
  const slideCount = document.getElementById("slideCount");

  function showSlide(index) {
    slides[currentSlide].classList.remove("active");

    currentSlide = (index + slides.length) % slides.length;

    slides[currentSlide].classList.add("active");
    slideCount.textContent = `${currentSlide + 1} / ${slides.length}`;
  }

  function changeSlide(direction) {
    showSlide(currentSlide + direction);
  }
</script>

</body>
</html>
