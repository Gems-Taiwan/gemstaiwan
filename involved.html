<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gems Taiwan — Get Involved</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <style>
    .image-size {
      width: auto;
      height: 348px;
    }

    .container {
      display: flex;
      gap: 10px;
      /* optional spacing */
    }

    .box {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: box-shadow 0.18s, border-color 0.18s;
    }

    .signup-section {
      text-align: center;
      margin: 60px auto 40px;
      max-width: 900px;
      padding: 0 24px;
    }

    .signup-section a {
      word-break: break-word;
    }

    .standalone-diagram-wrapper {
      margin-top: 50px;
      margin-bottom: 50px;
      width: 100%;
      display: flex;
      justify-content: center;
      padding: 0 24px;
      box-sizing: border-box;
    }

    .standalone-diagram-wrapper img {
      width: 100%;
      max-width: 1300px;
      height: auto;
      display: block;
      border-radius: 16px;
    }

    .box-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 16px;
    }
  </style>

  <script>window.ACTIVE_PAGE = 'involved.html';</script>
  <script defer src="nav.js"></script>
</head>

<body>

  <main>

    <h1 class="page-title center" style="margin-top: 32px;">Get Involved</h1>

    <!-- Poster -->
    <div class="container">
      <div class="box">
        <h2 class="box-title">Elementary</h2>
        <img class="image-size" src="images/involved/elementary_eng.png" alt="English Poster 2">
      </div>
      <div class="box">
        <h2 class="box-title">Junior High School</h2>
        <img class="image-size" src="images/involved/junior_eng.png" alt="English Poster 4">
      </div>
      <div class="box">
        <h2 class="box-title">High School</h2>
        <img class="image-size" src="images/involved/high_eng.png" alt="English Poster">
      </div>
    </div>


    </div>

    <!-- Sign-up section -->
    <div class="signup-section">
      <h2>Sign-up Now</h2>
      <p><strong>Fill out this form to get started:</strong></p>

      <a href="https://docs.google.com/forms/d/1GA3MGRhnRAbWJxb010RgmITatjY5hBockVmNfAcopHI/edit" target="_blank">
        https://docs.google.com/forms/d/1GA3MGRhnRAbWJxb010RgmITatjY5hBockVmNfAcopHI/edit
      </a>
    </div>

    <!-- English flowchart -->
    <div class="standalone-diagram-wrapper">
      <img src="https://raw.githubusercontent.com/Oscariooooo/GEMSTAIWAN_ImageUPLOAD/main/EnglishFlowchart.png"
        alt="English workshop process diagram">
    </div>

  </main>

  <script>
    let currentSlide = 0;

    const slides = document.querySelectorAll(".poster-slide");
    const slideCount = document.getElementById("slideCount");

    function showSlide(index) {
      slides[currentSlide].classList.remove("active");

      currentSlide = (index + slides.length) % slides.length;

      slides[currentSlide].classList.add("active");
      slideCount.textContent = `${currentSlide + 1} / ${slides.length}`;
    }

    function changeSlide(direction) {
      showSlide(currentSlide + direction);
    }
  </script>

</body>

</html>
